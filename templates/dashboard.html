<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Chill Baby AI – Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal:     #5ec4bc;
      --teal-lt:  #7dd6ce;
      --teal-dk:  #4aafa7;
      --bg:       #f0f4f8;
      --card:     #ffffff;
      --border:   #e2eaee;
      --text:     #1a2533;
      --muted:    #8a99a8;
      --navbar-h: 64px;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .navbar {
      flex-shrink: 0;
      z-index: 100;
      height: var(--navbar-h);
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px;
      box-shadow: 0 1px 8px rgba(0,0,0,0.06);
    }
    .nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
    .nav-brand-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--teal-lt), var(--teal-dk));
      display: flex; align-items: center; justify-content: center; font-size: 18px;
    }
    .nav-brand-text h1 { font-size: 1rem; font-weight: 700; color: var(--teal); }
    .nav-brand-text p  { font-size: 0.65rem; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; }
    .nav-actions { display: flex; align-items: center; gap: 10px; }
    .nav-link {
      padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); font-size: 0.82rem; font-weight: 600;
      text-decoration: none; transition: background .2s, border-color .2s;
    }
    .nav-link:hover { background: #f0f9f8; border-color: var(--teal); color: var(--teal-dk); }
    .nav-link.primary {
      background: linear-gradient(135deg, var(--teal-lt), var(--teal-dk));
      border-color: transparent; color: #fff;
    }
    .nav-link.primary:hover { opacity: 0.92; color: #fff; }

    .dash-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      padding: 16px 24px 20px;
    }

    /* Header, filters, tabs — fixed; never scroll away */
    .dash-toolbar {
      flex-shrink: 0;
    }

    .dash-header {
      display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
      gap: 16px; margin-bottom: 20px;
    }
    .dash-header h2 { font-size: 1.45rem; font-weight: 700; letter-spacing: -0.3px; }
    .dash-header p { font-size: 0.88rem; color: var(--muted); margin-top: 4px; }
    .dash-meta { font-size: 0.75rem; color: var(--muted); }

    .filter-bar {
      display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px;
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 14px 16px; margin-bottom: 16px;
    }
    .filter-group { display: flex; flex-direction: column; gap: 4px; }
    .filter-group label { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
    .filter-group input {
      padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
      font-family: inherit; font-size: 0.85rem; min-width: 180px;
    }
    .filter-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .btn {
      padding: 9px 16px; border-radius: 10px; border: none; cursor: pointer;
      font-family: inherit; font-size: 0.85rem; font-weight: 600;
    }
    .btn-teal {
      background: linear-gradient(135deg, var(--teal-lt), var(--teal-dk)); color: #fff;
    }
    .btn-ghost {
      background: var(--card); border: 1px solid var(--border); color: var(--text);
    }
    .auto-label {
      display: flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--muted);
      cursor: pointer; user-select: none;
    }

    .tab-row {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-bottom: 12px;
    }
    .dash-tab {
      padding: 9px 16px; border-radius: 999px; border: 1px solid var(--border);
      background: var(--card); color: var(--muted); font-size: 0.82rem; font-weight: 600;
      cursor: pointer; transition: all .2s;
    }
    .dash-tab:hover { border-color: var(--teal); color: var(--teal-dk); }
    .dash-tab.active {
      background: linear-gradient(135deg, var(--teal-lt), var(--teal-dk));
      border-color: transparent; color: #fff;
    }

    .dash-panel { display: none; }
    .dash-panel.active {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .dash-panels {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    /* Must beat .panel-card — inactive tabs stay hidden (one panel visible at a time) */
    .panel-card.dash-panel:not(.active) {
      display: none !important;
    }
    .panel-card.dash-panel.active {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .panel-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      min-height: 0;
    }

    .panel-card.dash-panel.active > .panel-scroll {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-card.dash-panel.active > .panel-scroll:not(.panel-scroll--overview) {
      padding: 18px 22px 22px;
      box-sizing: border-box;
    }
    .panel-scroll--overview {
      overflow: visible;
      width: 100%;
    }

    /* Overview is summary cards only — do not stretch to fill the viewport */
    .dash-panels:has(> #panelOverview.active) {
      flex: 0 0 auto;
    }
    #panelOverview.panel-card.dash-panel.active {
      flex: 0 0 auto;
      align-self: stretch;
      width: 100%;
      min-height: auto;
      overflow: visible;
      margin-bottom: 12px;
    }
    #panelOverview.panel-card.dash-panel.active > .panel-scroll.panel-scroll--overview {
      flex: 0 0 auto;
      min-height: auto;
      overflow: visible;
      width: 100%;
      padding: 20px 22px 24px;
      box-sizing: border-box;
    }

    .panel-scroll--overview .stat-grid {
      width: 100%;
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }

    .dash-table-frame {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      height: 100%;
    }
    .dash-table-head {
      flex-shrink: 0;
      background: var(--card);
      border-bottom: 2px solid var(--border);
      padding: 4px 0 0;
      z-index: 5;
    }
    .dash-table-body-scroll {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 0 0 4px;
      -webkit-overflow-scrolling: touch;
    }

    .dash-hint { margin-top: 16px; font-size: 0.8rem; color: var(--muted); }

    .table-scroll { overflow: visible; }
    .dash-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      table-layout: fixed;
    }
    .dash-table-head .dash-table th {
      text-align: left; font-size: 0.65rem; text-transform: uppercase; letter-spacing: .6px;
      color: var(--muted); font-weight: 700; padding: 10px 12px;
      border-bottom: none; white-space: nowrap;
      background: var(--card);
    }
    .dash-table-body-scroll .dash-table td {
      padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle;
      word-break: break-word;
    }
    .dash-table-body-scroll .dash-table tbody tr:hover { background: #f8fbfc; }

    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 999px;
      font-size: 0.72rem; font-weight: 700; white-space: nowrap;
    }
    .badge-active { background: #e9f7f1; color: #16a34a; }
    .badge-ended { background: #eef2f6; color: var(--muted); }
    .badge-alert { background: #fdecec; color: #dc2626; }
    .badge-clear { background: #e9f7f1; color: #16a34a; }
    .badge-type { background: #eef6ff; color: #2563eb; text-transform: lowercase; }

    .dash-loading, .dash-empty, .dash-error {
      text-align: center; padding: 48px 20px; color: var(--muted); font-size: 0.9rem;
    }
    .dash-error { color: #dc2626; }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
    }
    .stat-card {
      display: flex; align-items: center; gap: 12px;
      padding: 16px; border-radius: 14px; border: 1px solid var(--border);
      background: #fafcfd;
      min-width: 0;
    }
    .stat-icon { font-size: 1.6rem; }
    .stat-value { font-size: 1.5rem; font-weight: 800; line-height: 1.1; }
    .stat-label { font-size: 0.78rem; color: var(--muted); font-weight: 600; margin-top: 2px; }
    .stat-teal .stat-value { color: var(--teal-dk); }
    .stat-green .stat-value { color: #16a34a; }
    .stat-orange .stat-value { color: #ea580c; }
    .stat-yellow .stat-value { color: #ca8a04; }
    .stat-red .stat-value { color: #dc2626; }

    @media (max-width: 720px) {
      .dash-wrap { padding: 12px 12px 16px; }
      .filter-group input { min-width: 140px; }
      .panel-scroll--overview .stat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="/dashboard" class="nav-brand">
    <div class="nav-brand-icon">📊</div>
    <div class="nav-brand-text">
      <h1>Chill Baby AI</h1>
      <p>Caregiver Dashboard</p>
    </div>
  </a>
  <div class="nav-actions">
    <a href="/children" class="nav-link" title="Manage child profiles and allergies">Children &amp; allergies</a>
    <a href="/process" class="nav-link primary" title="Return to monitor — start camera again to resume">Live monitor</a>
    <a href="/" class="nav-link">Login</a>
  </div>
</nav>

<div class="dash-wrap">
  <div class="dash-toolbar">
    <div class="dash-header">
      <div>
        <h2>Mealtime overview</h2>
        <p>Session history, food diary, allergen checks, and child status events{% if parent_name %} · {{ parent_name|e }}{% endif %}</p>
      </div>
      <div class="dash-meta" id="lastUpdated">—</div>
    </div>

    <div class="filter-bar">
      <div class="filter-group">
        <label for="filterSince">From</label>
        <input type="datetime-local" id="filterSince" />
      </div>
      <div class="filter-group">
        <label for="filterUntil">To</label>
        <input type="datetime-local" id="filterUntil" />
      </div>
      <div class="filter-actions">
        <button type="button" class="btn btn-teal" id="btnApplyFilters">Apply</button>
        <button type="button" class="btn btn-ghost" id="btnClearFilters">All time</button>
        <label class="auto-label">
          <input type="checkbox" id="autoRefresh" /> Auto-refresh (30s)
        </label>
      </div>
    </div>

    <div class="tab-row">
      <button type="button" class="dash-tab active" data-tab="overview">Overview</button>
      <button type="button" class="dash-tab" data-tab="meals">Meal sessions</button>
      <button type="button" class="dash-tab" data-tab="food">Food diary</button>
      <button type="button" class="dash-tab" data-tab="allergens">Allergen logs</button>
      <button type="button" class="dash-tab" data-tab="status">Child status</button>
    </div>
  </div>

  <div class="dash-panels">
    <div class="panel-card dash-panel active" id="panelOverview"><div class="panel-scroll panel-scroll--overview"></div></div>
    <div class="panel-card dash-panel" id="panelMeals"><div class="panel-scroll"></div></div>
    <div class="panel-card dash-panel" id="panelFood"><div class="panel-scroll"></div></div>
    <div class="panel-card dash-panel" id="panelAllergens"><div class="panel-scroll"></div></div>
    <div class="panel-card dash-panel" id="panelStatus"><div class="panel-scroll"></div></div>
  </div>
</div>

<script src="/static/dashboard.js"></script>
</body>
</html>
